# Linux 視覺基準圖：在 CI 的 Ubuntu 環境重新產生 test/visual/linux，以 artifact 下載後提交
# PR 改到畫面相關的檔案時自動執行；手動觸發要等這個檔案已在預設分支上（GitHub 的限制）
name: Visual baselines

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - '_locales/**'
      - 'vendor/**'
      - 'manifest.json'
      - 'package.json' # Playwright 升版會換 Chromium，畫面可能不同
      - 'package-lock.json'
      - 'test/visual.mjs'
      - 'test/fixtures/**'
      - '.github/workflows/visual-baselines.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      - name: 安裝 Chromium 與中日韓字型
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: 產生基準圖
        run: node test/visual.mjs --update

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-linux
          path: test/visual/linux/*.png
