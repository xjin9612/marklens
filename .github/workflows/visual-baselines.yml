# Linux 視覺基準圖：在 CI 的 Ubuntu 環境重新產生 test/visual/linux，以 artifact 下載後提交
# PR 改到畫面相關的檔案時自動執行；手動觸發要等這個檔案已在預設分支上（GitHub 的限制）
name: Visual baselines

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - '_locales/**'
      - 'vendor/**'
      - 'manifest.json'
      - 'package.json' # Playwright 升版會換 Chromium，畫面可能不同
      - 'package-lock.json'
      - 'test/visual.mjs'
      - 'test/fixtures/**'
      - '.github/workflows/visual-baselines.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      # Chromium 與 apt 下載的套件（Playwright 的系統相依套件、中日韓字型）存進快取：Ubuntu 套件鏡像站常常很慢
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-cache
          key: browser-apt-ubuntu-26.04-${{ hashFiles('package-lock.json') }}

      - name: 安裝 Chromium 與中日韓字型
        timeout-minutes: 10 # 第一次建立快取時仍要從鏡像站下載
        run: |
          # apt 下載的 .deb 放在快取的資料夾，已有相同版本時不再下載；partial 要讓 apt 的下載帳號 _apt 寫入
          mkdir -p ~/apt-cache/partial
          sudo chown _apt ~/apt-cache/partial
          echo "Dir::Cache::Archives \"$HOME/apt-cache\";" | sudo tee /etc/apt/apt.conf.d/99markloupe-cache >/dev/null
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          # apt 留下的 lock 只有 root 能讀，快取存檔時會讀不到
          sudo rm -f ~/apt-cache/lock
          sudo chmod -R a+rX ~/apt-cache

      - name: 產生基準圖
        run: node test/visual.mjs --update

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-linux
          path: test/visual/linux/*.png
