# 端對端測試：每次 push 到 main、每個 pull request；也供 release.yml 重複使用
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      # 罫線表格對齊的測試需要中日韓字型，GitHub 的 Linux 機器預設沒有
      - name: 安裝 Chromium 與中日韓字型
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: 執行測試
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          npm test
        env:
          SHOT_DIR: ${{ runner.temp }}/shots

      - name: 上傳測試截圖（失敗時）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
