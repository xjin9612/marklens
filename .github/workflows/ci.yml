# 端對端測試：每次 push 到 main、每個 pull request；也供 release.yml 重複使用
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # 版本一致、商店欄位長度、manifest 引用的檔案；不必等推送標籤才發現
      - name: 檢查發版條件
        run: node scripts/release.mjs check "v$(node -p "require('./package.json').version")"

      - name: 安裝相依套件
        run: npm ci

      # 相依套件都要有 npm registry 的簽章，有來源證明的一併驗證
      - name: 驗證相依套件簽章
        run: npm audit signatures

      # Chromium 與中日韓字型（52 MB）存進快取：Ubuntu 套件鏡像站常常很慢，命中時字型直接以 dpkg 安裝
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/apt-fonts
          key: browser-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # 框線字元表格對齊的測試需要中日韓字型，GitHub 的 Linux 機器預設沒有
      - name: 安裝 Chromium 與中日韓字型
        timeout-minutes: 10 # 第一次建立快取時字型仍要從鏡像站下載
        run: |
          npx playwright install --with-deps chromium
          if ! ls ~/apt-fonts/*.deb >/dev/null 2>&1; then
            mkdir -p ~/apt-fonts
            (cd ~/apt-fonts && apt-get download fonts-noto-cjk)
          fi
          sudo dpkg -i ~/apt-fonts/*.deb

      - name: 執行測試
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          npm test
        env:
          SHOT_DIR: ${{ runner.temp }}/shots

      - name: 上傳測試截圖（失敗時）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  # vendor/ 的每個檔案都要能由 npm 上的官方套件加上 vendor.mjs 的轉換重現（npm pack 會比對 registry 的雜湊）
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: 重現第三方程式庫
        run: |
          node scripts/vendor.mjs
          changed=$(git status --porcelain -- vendor)
          if [ -n "$changed" ]; then
            echo "::error::vendor/ 與官方套件重新產生的結果不同"
            echo "$changed"
            exit 1
          fi
