# 端對端測試：每次 push 到 main、每個 pull request；也供 release.yml 重複使用
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # 版本一致、商店欄位長度、manifest 引用的檔案；不必等推送標籤才發現
      - name: 檢查發版條件
        run: node scripts/release.mjs check "v$(node -p "require('./package.json').version")"

      - name: 安裝相依套件
        run: npm ci

      # 框線字元表格對齊的測試需要中日韓字型，GitHub 的 Linux 機器預設沒有
      - name: 安裝 Chromium 與中日韓字型
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: 執行測試
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          npm test
        env:
          SHOT_DIR: ${{ runner.temp }}/shots

      - name: 上傳測試截圖（失敗時）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
