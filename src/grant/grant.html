<!doctype html>
<html class="ml-ui">
<head>
  <meta charset="utf-8">
  <title data-i18n="grantPageTitle">MarkLens</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="grant.css">
  <script src="../shared/theme.js"></script>
</head>
<body>
  <main>
    <h1 data-i18n="grantH1"></h1>
    <p data-i18n="grantIntro"></p>

    <div id="back-row" class="notice" hidden>
      <span data-i18n="grantBackNote"></span>
      <button type="button" id="back" class="primary" data-i18n="grantBack"></button>
    </div>

    <section>
      <div class="row">
        <h2 data-i18n="grantFolders"></h2>
        <button type="button" id="add" class="primary" data-i18n="grantAdd"></button>
      </div>
      <ul id="roots"></ul>
      <p id="empty" class="muted" hidden data-i18n="grantEmpty"></p>
    </section>

    <section class="tips">
      <h2 data-i18n="grantTips"></h2>
      <ul>
        <li data-i18n-html="grantTip1"></li>
        <li data-i18n-html="grantTip2"></li>
        <li data-i18n="grantTip3"></li>
      </ul>
    </section>
    <p id="status" class="muted"></p>
  </main>
  <script src="../shared/settings.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/roots.js"></script>
  <script src="grant.js"></script>
</body>
</html>
