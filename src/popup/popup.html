<!doctype html>
<html class="ml-ui">
<head>
  <meta charset="utf-8">
  <title data-i18n="popupTitle">MarkLens</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="popup.css">
  <script src="../shared/theme.js"></script>
</head>
<body>
  <header>
    <strong>MarkLens</strong>
    <label class="switch" data-i18n-title="popupEnableTitle">
      <input type="checkbox" name="enabled"> <span data-i18n="popupEnable"></span>
    </label>
  </header>

  <p id="file-warning" class="warning" hidden>
    <span data-i18n-html="popupFileWarning"></span>
    <button type="button" id="open-details" data-i18n="openSettings"></button>
  </p>

  <!-- 常用設定直接顯示，其餘可收合（展開狀態記在本機） -->
  <section>
    <h2><span data-i18n="secAppearance"></span> <small data-i18n="secAppearanceNote"></small></h2>
    <label><span data-i18n="theme"></span>
      <select name="theme">
        <option value="auto" data-i18n="themeSystem"></option>
        <option value="light" data-i18n="themeLight"></option>
        <option value="dark" data-i18n="themeDark"></option>
      </select>
    </label>
    <label><span data-i18n="palette"></span>
      <select name="palette">
        <option value="github" data-i18n="paletteGithub"></option>
        <option value="sepia" data-i18n="paletteSepia"></option>
        <option value="contrast" data-i18n="paletteContrast"></option>
      </select>
    </label>
    <label><span data-i18n="uiLang"></span>
      <select name="uiLang">
        <option value="auto" data-i18n="langAuto"></option>
        <option value="en">English</option>
        <option value="zh_TW">繁體中文</option>
        <option value="zh_CN">简体中文</option>
      </select>
    </label>
    <label><span data-i18n="fontSize"></span>
      <input type="number" name="fontSize" min="10" max="32" step="1">
    </label>
    <label><span data-i18n="lineHeight"></span>
      <input type="number" name="lineHeight" min="1.2" max="2.4" step="0.1">
    </label>
  </section>

  <section>
    <h2><span data-i18n="secLayout"></span> <small data-i18n="secLayoutNote"></small></h2>
    <label><span data-i18n="textWidth"></span>
      <select name="textWidth" data-type="number">
        <option value="0" data-i18n="widthFull"></option>
        <option value="1600">1600 px</option>
        <option value="1200">1200 px</option>
        <option value="960">960 px</option>
        <option value="custom" data-i18n="custom"></option>
      </select>
    </label>
    <label id="custom-width-row" hidden><span data-i18n="customWidth"></span>
      <input type="number" name="customWidth" min="480" max="4000" step="20">
    </label>
    <label><span data-i18n="tableWidth"></span>
      <select name="tableWidth">
        <option value="full" data-i18n="tableWidthFull"></option>
        <option value="text" data-i18n="tableWidthText"></option>
      </select>
    </label>
    <label><span data-i18n="tocDepth"></span>
      <select name="tocDepth" data-type="number">
        <option value="1">H1</option>
        <option value="2">H1–H2</option>
        <option value="3">H1–H3</option>
        <option value="4">H1–H4</option>
        <option value="6" data-i18n="all"></option>
      </select>
    </label>
    <label class="check"><input type="checkbox" name="tocHidden"> <span data-i18n="optTocHidden"></span></label>
    <label class="check"><input type="checkbox" name="tableWrap"> <span data-i18n="optTableWrap"></span></label>
    <label class="check"><input type="checkbox" name="codeWrap"> <span data-i18n="optCodeWrap"></span></label>
    <label class="check"><input type="checkbox" name="rememberScroll"> <span data-i18n="optRememberScroll"></span></label>
    <label class="check"><input type="checkbox" name="linkNewTab"> <span data-i18n="optLinkNewTab"></span></label>
    <label class="check" data-i18n-title="localOnlyTitle"><input type="checkbox" name="mermaid"> <span data-i18n="optMermaid"></span></label>
    <label class="check" data-i18n-title="localOnlyTitle"><input type="checkbox" name="math"> <span data-i18n="optMath"></span></label>
  </section>

  <section>
    <label class="check"><input type="checkbox" name="syncEnabled"> <span data-i18n="optSync"></span></label>
    <p class="hint" data-i18n="optSyncNote"></p>
  </section>

  <details class="sec" data-sec="css">
    <summary><span data-i18n="secCustomCss"></span> <small data-i18n="secCustomCssNote"></small></summary>
    <div class="sec-body">
      <textarea name="customCss" rows="6" spellcheck="false" data-i18n-placeholder="customCssPlaceholder"></textarea>
    </div>
  </details>

  <details class="sec" data-sec="files">
    <summary><span data-i18n="secFiles"></span> <small data-i18n="secFilesNote"></small></summary>
    <div class="sec-body">
      <label class="stack"><span data-i18n="fileIgnore"></span>
        <input type="text" name="fileIgnore" spellcheck="false" data-i18n-title="fileIgnoreTitle">
      </label>
    </div>
  </details>

  <details class="sec" data-sec="editor">
    <summary><span data-i18n="secEditor"></span> <small data-i18n="secEditorNote"></small></summary>
    <div class="sec-body">
      <label><span data-i18n="editor"></span>
        <select name="editor">
          <option value="none" data-i18n="editorNone"></option>
          <option value="vscode">VS Code</option>
          <option value="custom" data-i18n="editorCustom"></option>
        </select>
      </label>
      <label class="stack" id="editor-url-row" hidden><span data-i18n="editorUrl"></span>
        <input type="text" name="editorUrl" spellcheck="false" placeholder="vscode-insiders://file/{path}:{line}">
      </label>
      <p class="hint" data-i18n="editorHint"></p>
    </div>
  </details>

  <details class="sec" data-sec="task">
    <summary><span data-i18n="secTaskWrite"></span> <small data-i18n="secTaskWriteNote"></small></summary>
    <div class="sec-body">
      <label class="check"><input type="checkbox" name="taskWrite"> <span data-i18n="optTaskWrite"></span></label>
      <button type="button" id="manage-roots" data-i18n="manageFolders"></button>
    </div>
  </details>

  <details class="sec" data-sec="refresh">
    <summary><span data-i18n="secRefresh"></span> <small data-i18n="secLayoutNote"></small></summary>
    <div class="sec-body">
      <label><span data-i18n="mode"></span>
        <select name="autoRefresh">
          <option value="off" data-i18n="refreshOff"></option>
          <option value="local" data-i18n="refreshLocal"></option>
          <option value="all" data-i18n="refreshAll"></option>
        </select>
      </label>
      <label><span data-i18n="refreshInterval"></span>
        <input type="number" name="refreshInterval" min="300" max="10000" step="100">
      </label>
    </div>
  </details>

  <footer>
    <button type="button" id="toggle-raw" data-i18n="toggleRaw"></button>
    <button type="button" id="shortcuts" data-i18n="shortcutSettings"></button>
    <button type="button" id="help" data-i18n="help"></button>
    <span id="status"></span>
  </footer>

  <script src="../shared/settings.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
