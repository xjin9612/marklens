<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>MarkLens 設定</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>MarkLens</strong>
    <label class="switch" title="停用後頁面恢復為純文字">
      <input type="checkbox" name="enabled"> 啟用
    </label>
  </header>

  <p id="file-warning" class="warning" hidden>
    尚未允許存取本機檔案。請到擴充功能「詳細資料」開啟<b>「允許存取檔案網址」</b>。
    <button type="button" id="open-details">開啟設定頁</button>
  </p>

  <section>
    <h2>外觀 <small>即時套用到所有分頁</small></h2>
    <label>主題
      <select name="theme">
        <option value="auto">跟隨系統</option>
        <option value="light">淺色</option>
        <option value="dark">深色</option>
      </select>
    </label>
    <label>字體大小
      <input type="number" name="fontSize" min="12" max="24" step="1">
    </label>
    <label>行高
      <input type="number" name="lineHeight" min="1.2" max="2.4" step="0.1">
    </label>
  </section>

  <section>
    <h2>版面預設值 <small>新開或重新整理分頁後套用</small></h2>
    <label>文字寬度
      <select name="textWidth" data-type="number">
        <option value="0">滿版</option>
        <option value="1600">1600 px</option>
        <option value="1200">1200 px</option>
        <option value="960">960 px</option>
        <option value="custom">自訂…</option>
      </select>
    </label>
    <label id="custom-width-row" hidden>自訂寬度 (px)
      <input type="number" name="customWidth" min="480" max="4000" step="20">
    </label>
    <label>表格／程式碼寬度
      <select name="tableWidth">
        <option value="full">可超出文字欄</option>
        <option value="text">跟隨文字寬度</option>
      </select>
    </label>
    <label>目錄層級
      <select name="tocDepth" data-type="number">
        <option value="1">H1</option>
        <option value="2">H1–H2</option>
        <option value="3">H1–H3</option>
        <option value="4">H1–H4</option>
        <option value="6">全部</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" name="tocHidden"> 預設隱藏目錄</label>
    <label class="check"><input type="checkbox" name="tableWrap"> 表格儲存格換行</label>
    <label class="check"><input type="checkbox" name="codeWrap"> 程式碼自動換行</label>
    <label class="check"><input type="checkbox" name="rememberScroll"> 記住閱讀位置</label>
    <label class="check"><input type="checkbox" name="linkNewTab"> 外部連結在新分頁開啟</label>
    <label class="check" title="只在本機檔案繪製"><input type="checkbox" name="mermaid"> 繪製 Mermaid 圖表</label>
  </section>

  <section>
    <h2>勾選寫回 <small>本機檔案的任務清單直接勾選並存檔</small></h2>
    <label class="check"><input type="checkbox" name="taskWrite"> 啟用勾選寫回</label>
    <button type="button" id="manage-roots">管理授權資料夾</button>
  </section>

  <section>
    <h2>自動更新 <small>新開或重新整理分頁後套用</small></h2>
    <label>模式
      <select name="autoRefresh">
        <option value="off">關閉</option>
        <option value="local">僅本機檔案</option>
        <option value="all">全部</option>
      </select>
    </label>
    <label>檢查間隔 (ms)
      <input type="number" name="refreshInterval" min="300" max="10000" step="100">
    </label>
  </section>

  <footer>
    <button type="button" id="toggle-raw">切換原始文字</button>
    <button type="button" id="shortcuts">快捷鍵設定</button>
    <button type="button" id="help">使用說明</button>
    <span id="status"></span>
  </footer>

  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
