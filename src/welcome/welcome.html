<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="welcomeTitle">MarkLens</title>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <main>
    <header>
      <img src="/icons/icon128.png" width="56" height="56" alt="">
      <div>
        <h1 data-i18n="welcomeTitle"></h1>
        <p class="lead" data-i18n="welcomeLead"></p>
      </div>
    </header>

    <section class="step" id="step-file">
      <h2><span class="num">1</span><span data-i18n="step1Title"></span></h2>
      <p data-i18n-html="step1Text"></p>
      <ol>
        <li data-i18n="step1Li1"></li>
        <li data-i18n-html="step1Li2"></li>
        <li data-i18n="step1Li3"></li>
      </ol>
      <p class="status" id="file-status" data-state="checking" data-i18n="checking"></p>
      <button type="button" id="open-details" data-i18n="openExtSettings"></button>
    </section>

    <section class="step">
      <h2><span class="num">2</span><span data-i18n="step2Title"></span></h2>
      <p data-i18n-html="step2Text"></p>
      <p class="tip" data-i18n="step2Tip"></p>
    </section>

    <section class="step">
      <h2><span class="num">3</span><span data-i18n="step3Title"></span></h2>
      <table>
        <thead><tr><th data-i18n="colKey"></th><th data-i18n="colAction"></th></tr></thead>
        <tbody>
          <tr><td><kbd>t</kbd></td><td data-i18n="keyToc"></td></tr>
          <tr><td><kbd>r</kbd></td><td data-i18n="keyRaw"></td></tr>
          <tr><td><kbd>w</kbd></td><td data-i18n="keyWidth"></td></tr>
          <tr><td><kbd>d</kbd></td><td data-i18n="keyTheme"></td></tr>
          <tr><td><kbd>[</kbd> <kbd>]</kbd></td><td data-i18n="keyFold"></td></tr>
        </tbody>
      </table>
      <ul class="features">
        <li data-i18n-html="featTables"></li>
        <li data-i18n-html="featTasks"></li>
        <li data-i18n-html="featDiagrams"></li>
        <li data-i18n-html="featReload"></li>
      </ul>
    </section>

    <section class="step">
      <h2><span class="num">4</span><span data-i18n="step4Title"></span></h2>
      <p data-i18n-html="step4Text"></p>
    </section>

    <footer>
      <span id="version"></span> ·
      <a href="https://github.com/xjin9612/marklens" target="_blank" rel="noopener noreferrer">GitHub</a> ·
      <a href="https://github.com/xjin9612/marklens/blob/main/CHANGELOG.md" target="_blank" rel="noopener noreferrer" data-i18n="changelog"></a>
    </footer>
  </main>
  <script src="../shared/settings.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
